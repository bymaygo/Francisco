<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrenos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060607">
<title>Entrenos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#060607;--c1:#232325;--c2:#18181a;--in:#2a2a2d;--line:rgba(255,255,255,.07);--t:#f5f5f7;--d:#8d8d93;--d2:#55555b;--d3:#2c2c30}
html,body{background:var(--bg);color:var(--t);font-family:'Inter Tight',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 35%,#1b1b1f,#040405)}
.phone{width:415px;height:874px;border-radius:66px;padding:11px;flex:none;transform-origin:center;position:relative;background:#050505;box-shadow:0 0 0 3px #77736e,0 0 0 4px #4a4744,inset 0 0 0 1px #1a1a1a,0 50px 120px rgba(0,0,0,.75)}
.btn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#5d5a56,#8a8681)}
.btn.l{left:-6px}.btn.r{right:-6px}
.screen{width:393px;height:852px;border-radius:55px;overflow:hidden;position:relative;transform:translateZ(0);background:radial-gradient(120% 50% at 50% -10%,#1c1c1f 0%,var(--bg) 60%)}
.scroller{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
#app[data-v=ajustes]{padding-bottom:20px}
#app[data-v=ajustes] .txtbtn{margin-top:4px!important}
#app[data-v=ajustes] .sec{margin-top:22px}
#app[data-v=ajustes] .dt{min-height:110px}
#app[data-v=ajustes] .txtbtn{padding:10px}
.firma{text-align:center;font-size:11px;color:var(--d2);letter-spacing:.04em;margin-top:22px}
.status{position:absolute;top:0;left:0;right:0;height:56px;z-index:85;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 48px;font-size:16px;font-weight:600;pointer-events:none;background:linear-gradient(#060607 55%,rgba(6,6,7,0))}
.status .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#fff;z-index:90;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.25;cursor:default}
input{font:inherit;color:inherit}
input::placeholder{color:var(--d2)}
svg{display:block}
#app{max-width:440px;margin:0 auto;padding:62px 18px 108px;min-height:100%}
#app[data-v=workout],#app[data-v=setup]{padding-bottom:126px}
#app[data-v=edit]{padding-bottom:36px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 24px}
h1{font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:1}
.circ{width:52px;height:52px;border-radius:50%;background:var(--d3);display:grid;place-items:center;flex:none;color:var(--t)}
.circ svg{width:22px;height:22px}
.circ.white{background:#fff;color:#000}
.nav2{display:flex;gap:10px}

.card{background:linear-gradient(165deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35);position:relative;cursor:default}
[data-a].card{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sq{aspect-ratio:1;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.lbl{font-size:19px;font-weight:500;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--d);margin-top:3px}
.big{font-size:66px;font-weight:600;letter-spacing:-.05em;line-height:.9}
.big small{font-size:20px;color:var(--d);font-weight:500;letter-spacing:-.01em;margin-left:6px}
.ring{position:relative;width:72px;height:72px}
.ring svg,.rring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:600}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--d);margin:30px 6px 12px}

.wide{padding:22px 0 20px}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 20px}
.mth h4{font-size:13px;font-weight:500;text-align:center;margin-bottom:14px;color:#d8d8dc}
.dots{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:9px;row-gap:5px;justify-items:center;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:#55555b}
.dot.on{width:7px;height:7px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.dot.fut{background:#29292d}
.dot.empty{background:transparent}
.wfoot{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 0}
.arrow{color:var(--d2)}
.arrow svg{width:22px;height:22px}

.day{display:block;width:100%;text-align:left;padding:20px 22px;margin-bottom:12px;overflow:hidden}
.day.open{background:linear-gradient(165deg,#2d2d30,#1c1c1f)}
.day.open::before{content:'';position:absolute;right:-30px;top:-40px;width:170px;height:170px;background:radial-gradient(circle,rgba(255,255,255,.11),transparent 65%);pointer-events:none}
.dayrow{display:flex;align-items:center;gap:18px;position:relative}
.dnum{width:42px;flex:none}
.dnum span{display:block;font-size:12px;letter-spacing:.08em;color:var(--d);font-weight:500}
.dnum b{display:block;font-size:34px;font-weight:600;line-height:1.05}
.vline{width:1px;align-self:stretch;background:var(--line);margin:4px 0}
.dinfo{flex:1;min-width:0}
.dname{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta{font-size:14px;color:var(--d);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:30px;height:30px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,255,255,.35);flex:none}
.chk svg{width:16px;height:16px}
.tag{font-size:12px;color:var(--d);border:1px solid var(--d3);border-radius:99px;padding:5px 10px;flex:none}
.pill{display:block;width:100%;height:58px;border-radius:999px;background:#fff;color:#000;font-size:18px;font-weight:600;margin-top:18px;position:relative}
.pill.ghost{background:var(--d3);color:var(--t);margin-top:10px}
.resume{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 16px 22px;margin-bottom:12px}
.resume .sub{margin:0 0 2px}
.resume .circ{width:46px;height:46px}

.ord{display:flex;flex-direction:column;gap:6px}
.mini{width:34px;height:34px;border-radius:50%;background:var(--d3);display:grid;place-items:center;color:var(--d);font-size:13px;font-weight:600;flex:none}
.mini svg{width:16px;height:16px}
.add{width:100%;border:1.5px dashed #2e2e33;border-radius:28px;padding:22px;color:var(--d);font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.015)}
.add svg{width:20px;height:20px}
.lead{color:var(--d);font-size:16px;line-height:1.45;margin:-10px 4px 24px}
.txtbtn{display:block;width:100%;padding:14px;color:var(--d);font-size:15px;margin-top:8px}

.hero{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1.02;margin:48px 4px 16px;color:#e4e4e8}
.hero span{color:#5e5e64}
.setup .lead{margin:0 4px 26px}
.demo{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--d);padding:8px 8px 8px 16px;border:1px solid var(--d3);border-radius:999px;margin-bottom:16px}
.demo button{color:#000;background:#fff;font-weight:600;padding:7px 14px;border-radius:99px;font-size:13px}

/* entreno */
.wcount{font-size:15px;color:var(--d)}
.wcount b{color:var(--t);font-weight:600}
.wtitle{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:4px 4px 0}
.wsub{margin:6px 4px 0}
.bar{height:2px;background:var(--d3);border-radius:2px;margin:22px 4px 22px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;transition:width .3s}
.ex{padding:20px 16px 16px;margin-bottom:12px}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 6px 14px}
.exn{font-size:19px;font-weight:600;letter-spacing:-.01em}
.exm{font-size:13px;color:var(--d);white-space:nowrap}
.rows{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center}
.hd{font-size:11px;letter-spacing:.12em;color:var(--d2);text-align:center;text-transform:uppercase}
.sn{text-align:center;color:var(--d);font-size:15px;font-weight:500}
.num{width:100%;height:48px;border-radius:14px;background:var(--in);border:1px solid transparent;text-align:center;font-size:18px;font-weight:500;outline:none;transition:.2s}
.num::placeholder{color:#6e6e74}
.num:focus{border-color:rgba(255,255,255,.3)}
.num.dn{background:transparent;color:#7b7b81;border-color:var(--d3)}
.sc{width:42px;height:42px;border-radius:50%;border:1.5px solid #3c3c41;display:grid;place-items:center;justify-self:center;color:transparent;transition:.2s}
.sc svg{width:18px;height:18px}
.sc.on{background:#fff;border-color:#fff;color:#000;box-shadow:0 0 18px rgba(255,255,255,.3)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:30px 18px 34px;background:linear-gradient(rgba(6,6,7,0),var(--bg) 40%);z-index:20}
.dock-in{max-width:404px;margin:0 auto}
.dock .pill{margin:0}

#restbox{position:fixed;left:50%;bottom:112px;transform:translate(-50%,20px);opacity:0;pointer-events:none;width:calc(100% - 36px);max-width:404px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;z-index:30;transition:opacity .25s,transform .25s;background:linear-gradient(165deg,#2e2e31,#1f1f22)}
#restbox.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#restbox.hide{display:none}
.rtxt{flex:1;padding-left:4px}
.rtxt .sub{margin:0}
.rbig{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin-top:2px}
#restbox .mini{width:42px;height:42px;color:var(--t)}

#restbox.attop{bottom:auto;top:62px;transform:translate(-50%,-20px)}
#restbox.attop.show{transform:translate(-50%,0)}
#restbox.full{left:0;top:0;bottom:0;right:0;width:auto;max-width:none;transform:none;border-radius:0;border:0;box-shadow:none;flex-direction:column;justify-content:center;gap:30px;padding:70px 28px 50px;background:rgba(6,6,7,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:35}
#restbox.full.show{transform:none}
.fl-ring{position:relative;width:260px;height:260px}
.fl-ring .rring svg{width:260px;height:260px}
.fl-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#restbox.full .rbig{font-size:86px;letter-spacing:-.05em}
#restbox.full #rlbl{font-size:18px}
.fl-next{text-align:center;padding:0 10px}
.fl-next .lbl{font-size:17px;margin-top:4px;line-height:1.35}
.fl-btns{display:flex;gap:10px;align-items:center;width:100%;max-width:330px}
#restbox .fl-btns .mini{width:58px;height:58px;font-size:15px}
.fl-btns .pill{margin:0;flex:1}
#restbox.done #rlbl{color:#fff}

/* ajustes */
.tile{overflow:hidden}
.tile .tico{position:absolute;top:20px;right:20px;color:var(--d2)}
.tile .tico svg{width:22px;height:22px}
.tile.dis{opacity:.35}
.tnum{font-size:46px}
.mph{width:44px;height:76px;border-radius:12px;border:2px solid #4a4a50;position:relative}
.mph i{position:absolute;left:5px;right:5px;height:11px;border-radius:5px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.35)}
.mph i.b{bottom:6px}.mph i.t{top:6px}
.mph i.f{top:5px;bottom:5px;height:auto;border-radius:8px;background:none;border:2px solid #fff}
.mph i.f::after{content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2px solid #fff}
.ring.sm b{font-size:18px}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 16px 22px;margin-bottom:12px}
.wrow .circ{width:46px;height:46px}
.dt{padding:20px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.dt svg{width:26px;height:26px;color:var(--t)}
.opts{padding:2px 18px}
.opt{display:block;width:100%;text-align:left;padding:18px 2px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.lbl2{font-size:17px;font-weight:500}
.opt .sub{line-height:1.4}
.lnk svg{width:20px;height:20px;color:var(--d2);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#111113;border-radius:999px;padding:4px;margin-top:14px}
.seg button{height:40px;border-radius:999px;color:var(--d);font-size:15px;font-weight:500;transition:.2s}
.seg button.on{background:#fff;color:#000}
.sw{width:52px;height:32px;border-radius:99px;background:#3a3a3f;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#fff}
.sw.on::after{left:23px;background:#000}
.ta{width:100%;height:120px;margin-top:14px;background:#111113;border:1px solid var(--line);border-radius:16px;color:var(--t);padding:12px;font-size:13px;font-family:ui-monospace,monospace;outline:none;resize:none}

#splash{position:fixed;inset:0;z-index:80;color:#f5f5f7;background:radial-gradient(120% 50% at 50% -10%,#1c1c1f 0%,#060607 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{height:170px;animation:bob 1.4s ease-in-out infinite}
#splash .stl{color:#f5f5f7;font-size:32px;font-weight:700;letter-spacing:-.035em}
#splash .sl{width:120px;height:2px;border-radius:2px;background:#2c2c30;overflow:hidden;margin-top:6px}
#splash .sl i{display:block;height:100%;width:0;background:#fff;animation:sfill 1.1s ease-in-out forwards}
#splash .sig{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.04em;color:#8d8d93}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes sfill{to{width:100%}}
/* calendario */
.calg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px;padding:22px 16px 18px}
.wd{font-size:12px;color:var(--d2);text-align:center;margin-bottom:4px}
.cd{height:34px;display:grid;place-items:center;position:relative}
.cd i{width:6px;height:6px;border-radius:50%;background:#55555b}
.cd.on{cursor:pointer}
.cd.on i{width:12px;height:12px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.55)}
.cd.fut i{background:#25252a}
.cd.today::after{content:'';position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.cfoot{padding:18px 22px 22px;border-top:1px solid var(--line)}
.cfoot .big{font-size:50px}
.ent{display:flex;gap:14px;padding:16px 14px 14px 20px;margin-bottom:10px;align-items:flex-start}
.ent .dd{font-size:70px;font-weight:400;letter-spacing:-.045em;line-height:.85;min-width:84px}
.ent .dw{font-size:13px;color:var(--d);margin-top:10px}
.items{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.it{background:rgba(255,255,255,.045);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.it b{font-weight:500}
.it span{color:var(--d);font-size:14px;white-space:nowrap}
.it.col{flex-direction:column;gap:4px}
.it.col span{white-space:normal;font-size:13px;line-height:1.5}
.noev{display:flex;align-items:center;gap:10px;color:var(--d2);font-size:15px;padding:24px 0}
.noev i{width:24px;height:24px;border-radius:50%;background:var(--d3)}

/* editar */
.title-in{width:100%;background:none;border:0;outline:none;font-size:36px;font-weight:700;letter-spacing:-.035em;padding:6px 4px 14px;border-bottom:1px solid var(--line)}
.ed{padding:16px;margin-bottom:12px}
.ed .nm{width:100%;background:none;border:0;outline:none;font-size:18px;font-weight:600;padding:4px 4px 14px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f3 label{font-size:11px;letter-spacing:.1em;color:var(--d);text-transform:uppercase;display:block;text-align:center;margin-bottom:6px}
.edtools{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}

/* tabs, modal, toast */
#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,9,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:10}
#tabs .in{max-width:440px;margin:0 auto;display:flex;justify-content:space-around;padding:14px 0 30px}
.tb{color:#4a4a50;padding:6px 22px}
.tb svg{width:27px;height:27px}
.tb.on{color:#fff}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:18px}
#overlay.show{display:flex}
.modal{width:100%;max-width:404px;padding:26px 22px 14px;margin-bottom:8px}
.modal h3{font-size:25px;font-weight:600;letter-spacing:-.02em}
.modal p{color:var(--d);margin-top:8px;font-size:15px;line-height:1.45}
#toast{position:fixed;top:62px;left:50%;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#000;padding:12px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:500px){
 body{display:block}
 .btn{display:none}
 .phone{width:100%;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
 .screen{width:100%;height:100%;border-radius:0}
 .status,.homebar{display:none}
 #app{padding-top:calc(26px + env(safe-area-inset-top))}
 #toast{top:calc(22px + env(safe-area-inset-top))}
 #tabs .in{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
 .dock{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
 #restbox{bottom:calc(100px + env(safe-area-inset-bottom))}
 #restbox.attop{top:calc(16px + env(safe-area-inset-top))}
 #splash .sig{bottom:calc(28px + env(safe-area-inset-bottom))}
 #restbox.full{padding-top:calc(40px + env(safe-area-inset-top));padding-bottom:calc(40px + env(safe-area-inset-bottom))}
 #overlay{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
</style>
</head>

/* ---------- Rutina aleatoria (solo DEMO) ---------- */
const POOL={
 pecho:['Press banca','Press inclinado con mancuernas','Aperturas en polea','Press declinado','Cruce de poleas'],
 espalda:['Dominadas lastradas','Remo con barra','Jalón al pecho','Remo en polea baja','Remo con mancuerna'],
 pierna:['Sentadilla','Prensa','Peso muerto rumano','Extensión de cuádriceps','Curl femoral','Zancadas','Gemelos de pie','Hip thrust'],
 hombro:['Press militar','Elevaciones laterales','Pájaros','Face pull','Press Arnold'],
 biceps:['Curl con barra','Curl martillo','Curl inclinado','Curl en polea'],
 triceps:['Press francés','Extensión en polea','Fondos en paralelas','Patada de tríceps'],
 core:['Crunch en polea','Elevación de piernas','Rueda abdominal']
};
const BASE={pecho:55,espalda:50,pierna:80,hombro:30,biceps:14,triceps:22,core:25};
const SPLITS=[
 [['Pecho + tríceps',[['pecho',3],['triceps',2]]],['Espalda + bíceps',[['espalda',3],['biceps',2]]],['Pierna',[['pierna',5]]],['Hombro + core',[['hombro',3],['core',2]]],['Full body',[['pecho',1],['espalda',1],['pierna',2],['hombro',1]]]],
 [['Torso A',[['pecho',2],['espalda',2],['hombro',1]]],['Pierna A',[['pierna',4],['core',1]]],['Torso B',[['espalda',2],['pecho',2],['hombro',1]]],['Pierna B',[['pierna',4],['core',1]]],['Brazos',[['biceps',2],['triceps',2],['hombro',1]]]],
 [['Empuje',[['pecho',3],['hombro',1],['triceps',1]]],['Tirón',[['espalda',3],['biceps',2]]],['Pierna',[['pierna',5]]],['Torso',[['pecho',2],['espalda',2],['hombro',1]]],['Pierna + core',[['pierna',3],['core',2]]]]
];
function randomRoutine(){
 return pick(SPLITS).map(([name,groups])=>({id:uid(),name,exercises:groups.flatMap(([g,n])=>shuffle(POOL[g]).slice(0,n).map(nm=>({id:uid(),name:nm,sets:String(pick([3,3,4])),reps:String(pick([8,10,12])),rest:String(pick([60,90,90,120])),_g:g})))}));
}
function demoHistory(){
 const out=[];const today=new Date();today.setHours(0,0,0,0);let di=0;
 for(let back=75;back>=1;back--){
  const d=new Date(today);d.setDate(d.getDate()-back);const wd=d.getDay();
  if(wd===0||wd===6||Math.random()<.18)continue;
  const day=S.days[di%S.days.length];di++;
  const prog=1+(75-back)/75*.12;
  out.push({id:uid(),dayId:day.id,dayName:day.name,date:iso(d),exercises:day.exercises.map(e=>{
   const b=(BASE[e._g]||30)*prog;const n=+e.sets||3;
   return{exId:e.id,name:e.name,rows:Array.from({length:n},(_,i)=>({kg:String(Math.max(2.5,Math.round(b*(1-i*.03)/2.5)*2.5)),reps:String((+e.reps||10)-(i===n-1&&Math.random()<.5?1:0)),done:true}))};
  })});
 }
 return out;
}

/* ---------- Estado ---------- */
function normalize(d){d.settings=Object.assign({mode:'down',view:'bar',pos:'bottom',sound:true},d.settings||{});d.active=d.active||null;d.days=d.days||[];d.sessions=d.sessions||[];return d}
function fresh(){return normalize({days:DEMO?randomRoutine():[],sessions:[],active:null,setupDone:false})}
function load(){try{const r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r))}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let view=S.setupDone?'home':'setup';
let editId=null,editBack='setup',openDay=null,openEnt=null;
let calMonth=new Date();calMonth.setDate(1);
let rest=null,restT=null;

const trainedSet=()=>new Set(S.sessions.map(s=>s.date));
const lastDate=id=>S.sessions.filter(s=>s.dayId===id).map(s=>s.date).sort().pop();
function lastRows(exId){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].exercises.find(x=>x.exId===exId);if(e&&e.rows.length)return e.rows}return null}
function nextDayId(){if(!S.days.length)return null;const l=S.sessions[S.sessions.length-1];if(!l)return S.days[0].id;const i=S.days.findIndex(d=>d.id===l.dayId);return S.days[(i+1)%S.days.length].id}
function relDate(s){const d=parse(s),t=new Date();t.setHours(0,0,0,0);const diff=Math.round((t-d)/864e5);if(diff===0)return'hoy';if(diff===1)return'ayer';if(diff<7)return DSEM[d.getDay()]+' '+d.getDate();return d.getDate()+' '+MES3[d.getMonth()].toLowerCase()}
function ring(p,size=72,sw=4){const r=(size-sw)/2,c=2*Math.PI*r,h=size/2;return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#3a3a3f" stroke-width="${sw}"/>${p>0?`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#fff" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}"/>`:''}</svg>`}

}
function routineList(){

function miniMonth(t,k,set){
 const m=new Date(t.getFullYear(),t.getMonth()-k,1);const n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();const off=(m.getDay()+6)%7;const tI=iso(t);
 let d='';for(let i=0;i<off;i++)d+='<i class="dot empty"></i>';
 for(let i=1;i<=n;i++){const s=iso(new Date(m.getFullYear(),m.getMonth(),i));d+=`<i class="dot${set.has(s)?' on':''}${s>tI?' fut':''}"></i>`}
 return`<div class="mth"><h4>${MES3[m.getMonth()]}</h4><div class="dots">${d}</div></div>`;
}

function vHome(){
 const t=new Date(),tI=iso(t);
 const ws=new Date(t);ws.setDate(t.getDate()-((t.getDay()+6)%7));const wsI=iso(ws);
 const week=S.sessions.filter(s=>s.date>=wsI&&s.date<=tI).length;
 const goal=S.days.length||1;
 const month=S.sessions.filter(s=>s.date.startsWith(tI.slice(0,7))).length;
 const nid=nextDayId();
 if(!openDay||!S.days.find(d=>d.id===openDay))openDay=S.active?S.active.dayId:nid;
 const set=trainedSet();
 let h=`<div class="top"><h1>Entrenos</h1><button class="circ" data-a="tab" data-v="ajustes" aria-label="Ajustes">${I.gear}</button></div>`;
 if(S.active)h+=`<div class="card resume" data-a="resume"><div><div class="sub">Entreno en curso</div><div class="lbl">${esc(S.active.dayName)}</div></div><div class="circ white">${I.next}</div></div>`;
 h+=`<div class="grid2">
  <div class="card sq" data-a="tab" data-v="cal"><div class="ring">${ring(week/goal)}<b>${week}</b></div><div><div class="lbl">Esta semana</div><div class="sub">de ${goal} entrenos</div></div></div>
  <div class="card sq" data-a="tab" data-v="cal"><div class="big">${month}</div><div><div class="lbl">Este mes</div><div class="sub">${MESES[t.getMonth()]}</div></div></div>
 </div>
 <div class="card wide" data-a="tab" data-v="cal"><div class="months">${[2,1,0].map(k=>miniMonth(t,k,set)).join('')}</div>
 <div class="wfoot"><div><div class="lbl">Seguimiento</div><div class="sub">Últimos 3 meses</div></div><span class="arrow">${I.next}</span></div></div>
 <div class="sec">Tu rutina</div>`;
 if(!S.days.length)return h+`<div class="card" style="padding:24px"><div class="lbl">Sin días de entreno</div><div class="sub">Monta tu rutina para empezar.</div><button class="pill" data-a="tab" data-v="rutina">Montar rutina</button></div>`;
 h+=S.days.map((d,i)=>{
  const last=lastDate(d.id),open=d.id===openDay,isAct=S.active&&S.active.dayId===d.id;
  const right=last===tI?`<div class="chk">${I.check}</div>`:d.id===nid&&!S.active?'<div class="tag">Siguiente</div>':'';
  return`<div class="card day${open?' open':''}" data-a="openday" data-id="${d.id}">${dayRow(d,i,last?' · últ. '+relDate(last):'')}${right}</div>
  ${open?`<button class="pill" data-a="start" data-id="${d.id}">${isAct?'Continuar':'Empezar'}</button>`:''}</div>`;
 }).join('');
 return h+'<div class="firma">va gosset a entrenar</div>';
}

function vWorkout(){

 let h=`<div class="top"><button class="circ" data-a="home" aria-label="Volver">${I.back}</button><div class="wcount"><b id="wdone">${dn}</b> / ${tot} series</div></div>

function vCal(){
 const y=calMonth.getFullYear(),mo=calMonth.getMonth(),pref=`${y}-${pad(mo+1)}`,tI=iso(new Date());
 const list=S.sessions.filter(s=>s.date.startsWith(pref)).sort((a,b)=>b.date.localeCompare(a.date));
 const set=new Set(list.map(s=>s.date));
 const n=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7;
 let g='LMXJVSD'.split('').map(c=>`<div class="wd">${c}</div>`).join('');
 for(let i=0;i<off;i++)g+='<div></div>';
 for(let d=1;d<=n;d++){const s=`${pref}-${pad(d)}`,on=set.has(s);g+=`<div class="cd${on?' on':''}${s>tI?' fut':''}${s===tI?' today':''}"${on?` data-a="goent" data-d="${s}"`:''}><i></i></div>`}
 let h=`<div class="top"><div><h1>${MESES[mo]}</h1><div class="sub">${y}</div></div><div class="nav2"><button class="circ" data-a="mprev" aria-label="Mes anterior">${I.back}</button><button class="circ" data-a="mnext" aria-label="Mes siguiente" ${pref>=tI.slice(0,7)?'disabled':''}>${I.next}</button></div></div>
 <div class="card"><div class="calg">${g}</div><div class="cfoot"><div class="big">${list.length}<small>entreno${list.length===1?'':'s'}</small></div></div></div>
 <div class="sec">Entrenos del mes</div>`;
 if(!list.length)return h+`<div class="card ent"><div class="dd" style="color:var(--d2)">–</div><div class="items"><div class="noev"><i></i>Sin entrenos</div></div></div>`;

  const d=parse(s.date),open=openEnt===s.id,ns=s.exercises.reduce((a,e)=>a+e.rows.length,0);
  return`<div class="card ent" id="e-${s.date}" data-a="toggleent" data-id="${s.id}"><div><div class="dd">${d.getDate()}</div><div class="dw">${DSEM[d.getDay()]}</div></div>

  </div></div>`;
 }).join('');
}

function startWorkout(id){

 S.active={dayId:id,dayName:day.name||'Entreno',started:Date.now(),exercises:day.exercises.map(e=>{
  const last=lastRows(e.id),n=Math.max(1,+e.sets||1);
  return{exId:e.id,name:e.name,reps:e.reps,rest:+e.rest||0,rows:Array.from({length:n},(_,i)=>{const l=last&&(last[i]||last[last.length-1]);return{kg:'',reps:'',pkg:l?l.kg:'',preps:l?l.reps:String(e.reps||''),done:false}})};
 })};
 save();go('workout');
}
function toggleSet(ei,ri){
 const r=S.active.exercises[ei].rows[ri];r.done=!r.done;
 if(r.done){if(!r.kg&&r.pkg)r.kg=r.pkg;if(!r.reps&&r.preps)r.reps=r.preps;document.querySelectorAll(`input[data-e="${ei}"][data-r="${ri}"]`).forEach(el=>el.value=r[el.dataset.f])}
 save();
 document.querySelectorAll(`[data-e="${ei}"][data-r="${ri}"]`).forEach(el=>el.classList.toggle(el.dataset.a==='set'?'on':'dn',r.done));
 const tot=S.active.exercises.reduce((a,e)=>a+e.rows.length,0),dn=S.active.exercises.reduce((a,e)=>a+e.rows.filter(x=>x.done).length,0);
 $('#wdone').textContent=dn;$('#wbar').style.width=(tot?dn/tot*100:0)+'%';
 if(r.done)startRest(S.active.exercises[ei].rest,nextInfo(ei));
}
function exportData(){
 const data=JSON.stringify(Object.assign({},S,{active:null})),name='entrenos-copia-'+iso(new Date())+'.json';
 const fallback=()=>{const show=()=>modal(`<h3>Tu copia</h3><p>Copia este texto y guárdalo.</p><textarea class="ta" readonly>${esc(data)}</textarea><button class="pill ghost" data-a="close">Cerrar</button>`);try{navigator.clipboard.writeText(data).then(()=>toast('Copia hecha (en texto)'),show)}catch(x){show()}};
 if(window.self!==window.top)return fallback(); // vista previa: aquí no se pueden guardar archivos
 try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Copia de Entrenos'}).then(()=>toast('Copia guardada'),e=>{if(!e||e.name!=='AbortError')fallback()});return}}catch(x){}
 try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Copia descargada');return}catch(x){}
 fallback();
}
function nextInfo(ei){
 const ex=S.active.exercises;
 for(let k=0;k<ex.length;k++){const a=(ei+k)%ex.length;const b=ex[a].rows.findIndex(r=>!r.done);if(b>=0){const r=ex[a].rows[b];return`${esc(ex[a].name)} · serie ${b+1}<br><span style="color:var(--d)">${esc(r.kg||r.pkg||'–')} kg × ${esc(r.reps||r.preps||'–')}</span>`}}
 return'Era la última serie';
}
function saveSession(){
 const A=S.active,anyDone=A.exercises.some(e=>e.rows.some(r=>r.done));
 const exs=A.exercises.map(e=>({exId:e.exId,name:e.name,rows:e.rows.filter(r=>!anyDone||r.done).map(r=>({kg:r.kg,reps:r.reps,done:true}))})).filter(e=>e.rows.length);
 S.sessions.push({id:uid(),dayId:A.dayId,dayName:A.dayName,date:iso(new Date()),exercises:exs});
 S.sessions.sort((a,b)=>a.date.localeCompare(b.date));
 S.active=null;stopRest();save();closeModal();openDay=null;go('home');toast('Entreno guardado');
}

/* ---------- Descanso ---------- */
let actx;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}}
function beep(){
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
 if(!S.settings.sound||!actx)return;
 try{const t=actx.currentTime;[0,.22,.44].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.2);o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.22)})}catch(e){}
}
function startRest(sec,info){
 sec=+sec;if(!sec)return;unlockAudio();
 const st=S.settings,full=st.view==='full',now=Date.now();
 rest={start:now,target:sec,end:now+sec*1000,total:sec,up:st.mode==='up',fired:false,C:2*Math.PI*(full?122:25)};
 const box=$('#restbox');
 box.className='card'+(full?' full':st.pos==='top'?' attop':'');
 const svg=full?`<svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="122" fill="none" stroke="#2a2a2e" stroke-width="5"/><circle id="rarc" cx="130" cy="130" r="122" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="${rest.C}"/></svg>`
  :`<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="none" stroke="#3a3a3f" stroke-width="3.5"/><circle id="rarc" cx="28" cy="28" r="25" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${rest.C}"/></svg>`;
 const adj=rest.up?'':`<button class="mini" data-a="restm">−15</button><button class="mini" data-a="restp">+15</button>`;
 box.innerHTML=full
  ?`<div class="sub" id="rlbl">Descanso</div><div class="fl-ring"><div class="rring">${svg}</div><div class="fl-c"><div class="rbig" id="rbig"></div>${rest.up?`<div class="sub">de ${fmtRest(sec)}</div>`:''}</div></div>${info?`<div class="fl-next"><div class="sub">Siguiente</div><div class="lbl">${info}</div></div>`:''}<div class="fl-btns">${adj}<button class="pill" data-a="restx">${rest.up?'Seguir':'Saltar'}</button></div>`
  :`<div class="rring">${svg}</div><div class="rtxt"><div class="sub" id="rlbl">Descanso</div><div class="rbig" id="rbig"></div></div>${adj}<button class="mini" data-a="restx" aria-label="Cerrar">${I.x}</button>`;
 box.classList.toggle('hide',!['workout','ajustes'].includes(view));
 requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.add('show')));
 clearInterval(restT);restT=setInterval(tickRest,250);tickRest();
}
function tickRest(){
 if(!rest)return;const now=Date.now();
 if(rest.up){
  const el=Math.floor((now-rest.start)/1000);
  $('#rbig').textContent=fmtRest(el);$('#rarc').setAttribute('stroke-dashoffset',rest.C*(1-Math.min(1,el/rest.target)));
  if(el>=rest.target&&!rest.fired){rest.fired=true;$('#rlbl').textContent='¡Ya puedes seguir!';$('#restbox').classList.add('done');beep()}
  return;
 }
 const left=Math.max(0,Math.ceil((rest.end-now)/1000));
 $('#rbig').textContent=fmtRest(left);$('#rarc').setAttribute('stroke-dashoffset',rest.C*(1-left/rest.total));
 if(!left&&!rest.fired){rest.fired=true;clearInterval(restT);$('#rlbl').textContent='¡Siguiente serie!';$('#restbox').classList.add('done');beep();const st=rest.start;setTimeout(()=>{if(rest&&rest.start===st)stopRest()},3000)}
}
function stopRest(){rest=null;clearInterval(restT);$('#restbox').classList.remove('show')}

/* ---------- Modal y aviso ---------- */
function modal(h){const o=$('#overlay');o.innerHTML=`<div class="card modal">${h}</div>`;o.classList.add('show')}
function closeModal(){$('#overlay').classList.remove('show')}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000)}
const move=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
 if(e.target.id==='overlay'){closeModal();return}
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 const a=el.dataset.a,id=el.dataset.id,i=+el.dataset.i,day=S.days.find(x=>x.id===editId);
 switch(a){
  case'tab':go(el.dataset.v);break;
  case'openday':openDay=id;render();break;
  case'start':
   if(S.active&&S.active.dayId===id)go('workout');
   else if(S.active)modal(`<h3>Tienes un entreno a medias</h3><p>${esc(S.active.dayName)} sigue abierto. Si empiezas otro, se descarta.</p><button class="pill" data-a="startforce" data-id="${id}">Empezar igualmente</button><button class="pill ghost" data-a="close">Cancelar</button>`);
   else startWorkout(id);break;
  case'startforce':S.active=null;stopRest();closeModal();startWorkout(id);break;
  case'resume':go('workout');break;
  case'home':go('home');break;
  case'set':toggleSet(+el.dataset.e,+el.dataset.r);break;
  case'finish':{const A=S.active,tot=A.exercises.reduce((x,e)=>x+e.rows.length,0),dn=A.exercises.reduce((x,e)=>x+e.rows.filter(r=>r.done).length,0);
   modal(`<h3>¿Terminar entreno?</h3><p>${dn} de ${tot} series hechas. Se guarda con la fecha de hoy.</p><button class="pill" data-a="save">Guardar entreno</button><button class="pill ghost" data-a="close">Seguir entrenando</button><button class="txtbtn" data-a="discard">Descartar entreno</button>`);break}
  case'save':saveSession();break;
  case'close':closeModal();break;
  case'discard':S.active=null;stopRest();save();closeModal();go('home');toast('Entreno descartado');break;
  case'restm':if(rest){rest.end-=15000;tickRest()}break;
  case'restp':if(rest){rest.end+=15000;rest.total=Math.max(rest.total,Math.ceil((rest.end-Date.now())/1000));rest.fired=false;$('#restbox').classList.remove('done');clearInterval(restT);restT=setInterval(tickRest,250);$('#rlbl').textContent='Descanso';tickRest()}break;
  case'tmode':S.settings.mode=S.settings.mode==='down'?'up':'down';save();render();break;
  case'tview':S.settings.view=S.settings.view==='full'?'bar':'full';save();render();break;
  case'tpos':S.settings.pos=S.settings.pos==='top'?'bottom':'top';save();render();break;
  case'sound':S.settings.sound=!S.settings.sound;save();render();if(S.settings.sound){unlockAudio();beep()}break;
  case'testrest':startRest(15,'Así se verá entre series');break;
  case'export':exportData();break;
  case'import':modal(`<h3>Importar copia</h3><p>Elige el archivo de tu copia. Se sustituye todo lo que hay ahora.</p><label class="pill ghost" style="display:grid;place-items:center;cursor:pointer;margin-top:16px" id="impl">Elegir archivo<input type="file" id="impf" accept=".txt,.json,text/plain,application/json" hidden></label><textarea class="ta" id="imp" placeholder="…o pega aquí una copia en texto" style="height:70px"></textarea><button class="pill" data-a="importok">Importar</button><button class="pill ghost" data-a="close">Cancelar</button>`);break;
  case'importok':{try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.days)||!Array.isArray(d.sessions))throw 0;S=normalize(d);S.active=null;S.setupDone=true;stopRest();save();closeModal();openDay=null;go('home');toast('Copia importada')}catch(x){toast('Esa copia no es válida')}break}
  case'restx':stopRest();break;
  case'mprev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);openEnt=null;render();break;
  case'mnext':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);openEnt=null;render();break;
  case'goent':{const s=S.sessions.find(x=>x.date===el.dataset.d);if(s){openEnt=s.id;render();const t=$('#e-'+el.dataset.d);t&&t.scrollIntoView({behavior:'smooth',block:'center'})}break}
  case'toggleent':openEnt=openEnt===id?null:id;render();break;
  case'delses':modal(`<h3>¿Eliminar este entreno?</h3><p>Se borra del calendario.</p><button class="pill" data-a="delsesok" data-id="${id}">Eliminar</button><button class="pill ghost" data-a="close">Cancelar</button>`);break;
  case'delsesok':S.sessions=S.sessions.filter(s=>s.id!==id);save();closeModal();render();break;
  case'editday':editId=id;editBack=view;go('edit');break;
  case'addday':{const d={id:uid(),name:'',exercises:[]};S.days.push(d);save();editId=d.id;editBack=view==='edit'?editBack:view;go('edit');setTimeout(()=>$('.title-in')&&$('.title-in').focus(),50);break}
  case'dup':move(S.days,i,-1);save();render();break;
  case'ddown':move(S.days,i,1);save();render();break;
  case'eup':move(day.exercises,i,-1);save();render();break;
  case'edown':move(day.exercises,i,1);save();render();break;
  case'edel':day.exercises.splice(i,1);save();render();break;
  case'addex':{day.exercises.push({id:uid(),name:'',sets:'3',reps:'10',rest:'90'});save();render();const n=document.querySelectorAll('.ed .nm');n.length&&n[n.length-1].focus();break}
  case'editdone':go(editBack);break;
  case'delday':modal(`<h3>¿Eliminar este día?</h3><p>Se quitan el día y sus ejercicios de la rutina. Los entrenos ya guardados se mantienen.</p><button class="pill" data-a="deldayok">Eliminar día</button><button class="pill ghost" data-a="close">Cancelar</button>`);break;
  case'deldayok':S.days=S.days.filter(d=>d.id!==editId);save();closeModal();go(editBack);break;
  case'regen':S.days=randomRoutine();save();render();break;
  case'finishsetup':S.setupDone=true;if(DEMO&&!S.sessions.length)S.sessions=demoHistory();save();go('home');break;
  case'reset':modal(`<h3>¿Reiniciar la app?</h3><p>Se borran la rutina y todos los entrenos guardados.</p><button class="pill" data-a="resetok">Borrar todo</button><button class="pill ghost" data-a="close">Cancelar</button>`);break;
  case'resetok':S=fresh();stopRest();save();closeModal();openDay=null;go('setup');break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target,f=t.dataset.f;if(!f)return;
 if(view==='workout'){S.active.exercises[t.dataset.e].rows[t.dataset.r][f]=t.value;save();return}
 const d=S.days.find(x=>x.id===editId);if(!d)return;
 if(f==='dname')d.name=t.value;
 else{const ex=d.exercises[t.dataset.i],k={ename:'name',esets:'sets',ereps:'reps',erest:'rest'}[f];ex[k]=(k==='name'||k==='reps')?t.value:t.value.replace(/\D/g,'')}
 save();
});
document.addEventListener('change',e=>{if(e.target.id!=='impf'||!e.target.files[0])return;const f=e.target.files[0];f.text().then(t=>{$('#imp').value=t;$('#impl').firstChild.textContent='✓ '+f.name})});
document.addEventListener('focusin',e=>{if(e.target.classList.contains('num'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});

function fit(){const p=$('#phone');if(innerWidth<=500){p.style.transform='';return}p.style.transform=`scale(${Math.min(1,(innerHeight-32)/880,(innerWidth-32)/425)})`}
function clock(){const d=new Date();$('#clock').textContent=d.getHours()+':'+pad(d.getMinutes())}
addEventListener('resize',fit);fit();clock();setInterval(clock,20000);
setTimeout(()=>{const s=$('#splash');if(!s)return;s.classList.add('out');setTimeout(()=>s.remove(),500)},1300);
render();
</script>
</body>
</html>
